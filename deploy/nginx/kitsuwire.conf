# KitsuWire production virtual host.
# Copy to /etc/nginx/sites-available/kitsuwire.com after the TLS certificate exists.
# This file is isolated from other virtual hosts such as zitounaps.de.

server {
    listen 80;
    listen [::]:80;
    server_name kitsuwire.com www.kitsuwire.com;
    return 301 https://kitsuwire.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kitsuwire.com;

    ssl_certificate /etc/letsencrypt/live/kitsuwire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitsuwire.com/privkey.pem;

    client_max_body_size 9m;

    access_log /var/log/nginx/kitsuwire.access.log;
    error_log /var/log/nginx/kitsuwire.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kitsuwire.com;

    ssl_certificate /etc/letsencrypt/live/kitsuwire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kitsuwire.com/privkey.pem;
    return 301 https://kitsuwire.com$request_uri;
}
