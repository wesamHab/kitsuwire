name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://kitsuwire:kitsuwire_ci@localhost:5432/kitsuwire?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kitsuwire
          POSTGRES_USER: kitsuwire
          POSTGRES_PASSWORD: kitsuwire_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitsuwire -d kitsuwire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies for audit
        run: npm install --omit=dev --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install full build dependencies
        run: npm install

      - name: Validate article content
        run: npm run validate:content

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Import legacy articles
        run: npm run db:import

      - name: Type check
        run: npm run typecheck

      - name: Build application
        run: npm run build
